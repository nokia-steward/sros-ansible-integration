namespace: nokia
name: sros
version: 2.2.1
readme: README.md
authors:
- Sven Wisotzky <sven.wisotzky@nokia.com>
description: Ansible CLI and NETCONF plugins for Nokia SR OS, with workflow playbooks.
license:
  - BSD-3-Clause
tags:
- backup
- networking
- nokia
- sros
- timos
- netconf
- cli
- cliconf
- terminal
dependencies:
  ansible.netcommon: ">=5.2.0"
  ansible.utils: ">=3.0.0"
repository: https://github.com/nokia-steward/sros-ansible-integration
documentation: https://nokia-steward.github.io/sros-ansible-integration/
homepage: https://nokia-steward.github.io/sros-ansible-integration/
issues: https://github.com/nokia-steward/sros-ansible-integration/issues

build_ignore:
  - .flake8
  - .pylintrc
  - .pylintrc.plugins
  - .ansible-lint
  - .github
  - .gitignore
  - .venv
  - .vscode
  - .build
  - dist
  - docs
  - site
  - tools
  - tests
  - mkdocs.yml
  - Makefile
  - requirements-dev.txt
  - '*.tar.gz'
  - '**/__pycache__'
  - CHANGELOG.md
  - CONTRIBUTING.md
