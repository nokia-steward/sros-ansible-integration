# Test matrix: the single source of truth for GitHub Actions (.github/workflows/ci.yml) and
# nokia-steward-validator. Format: nokia-steward pattern version 1.
#
# Controller versions follow the support policy shared with nokia.openconfig and nokia.nsp: the
# ansible-core releases that still receive security fixes, each paired with a controller Python
# that it supports. ansible-core devel is an early warning and never blocks a merge.
#
# sanity: ansible-test sanity, one row per ansible-core and Python pair.
# integration: one case per SR OS release and configuration mode (config_mode). Each case deploys
# a single-node lab, tests/classic.clab.yml or tests/md.clab.yml, and runs the one test list,
# tests/playbooks.yml; the categories of the other mode are skipped. SR OS releases: the x.10
# releases, today 25.10 and 26.10. From 2027: the x.10 releases of the previous two years and the
# latest release of the current year (for example 25.10, 26.10 and 27.3). Each case pairs one SR OS
# release with one controller pair and names the image path it pulls (registry). The labels name
# the modes in the results table: Classic SROS 25.10, MD SROS 25.10.
version: 1

environment:
  apt: [libssh-dev]

inputs:
  python:      {toolchain: python}
  ansible:     {env: ANSIBLE_VERSION}
  sros:        {env: SROS_VERSION, requires: [srsim]}
  config_mode: {env: SROS_CONFIG_MODE, labels: {classic: Classic, md: MD}}
  registry:    {env: REGISTRY}

suites:
  sanity:
    run: make test-sanity
    timeout_minutes: 30
    cases:
      - {python: '3.12', ansible: '2.20'}
      - {python: '3.14', ansible: '2.21'}
      - {python: '3.13', ansible: '2.22'}
      - {python: '3.14', ansible: devel, experimental: true}

  # The cases need an SR-SIM license: SRSIM_LICENSE secret on GitHub, or nokia-steward-validator.
  integration:
    run: make test-integration
    timeout_minutes: 45
    cases:
      - {python: '3.14', ansible: '2.21', sros: '25.10.R1', config_mode: classic, registry: 'registry.srlinux.dev/pub/nokia_srsim'}
      - {python: '3.14', ansible: '2.21', sros: '25.10.R1', config_mode: md, registry: 'registry.srlinux.dev/pub/nokia_srsim'}
      - {python: '3.13', ansible: '2.22', sros: '26.10.R1', config_mode: classic, registry: 'registry.srlinux.dev/pub/nokia_srsim'}
      - {python: '3.13', ansible: '2.22', sros: '26.10.R1', config_mode: md, registry: 'registry.srlinux.dev/pub/nokia_srsim'}
