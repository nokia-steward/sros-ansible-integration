---
- name: MD-CLI · commands and CLI mode switch
  hosts: nokia_srsim
  gather_facts: No

  tasks:
  - name: get system information
    ansible.netcommon.cli_command:
      command: show system information
    register: output1

  - name: file list
    ansible.netcommon.cli_command:
      command: file list
    register: output2

  - name: switch mode classic
    ansible.netcommon.cli_command:
      command: /!classic-cli
    register: output3

  - name: show boot-messages (classic)
    ansible.netcommon.cli_command:
      command: show boot-messages
    register: output4

  - name: switch mode md-cli
    ansible.netcommon.cli_command:
      command: /!md-cli
    register: output5

  - name: show boot-messages (md-cli)
    ansible.netcommon.cli_command:
      command: show boot-messages
    register: output6

  - name: reboot node (abort)
    ansible.netcommon.cli_command:
      command: admin reboot
      prompt:
        - "Are you sure you want to reboot (y/n)?"
      answer:
        - 'n'
    register: output7

  - name: display system information
    debug:
      msg: |
        {{output1.stdout}}
        {{output2.stdout}}
        {{output3.stdout}}
        {{output4.stdout}}
        {{output5.stdout}}
        {{output6.stdout}}
        {{output7.stdout}}
...