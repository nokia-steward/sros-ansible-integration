---
- name: MD-CLI · config, rollback and backup
  hosts: nokia_srsim
  gather_facts: No

  tasks:
  - name: do some config
    cli_config:
      config: |
        configure system
          contact nobody
          location hamburg
          exit all

  - name: do rollback
    cli_config:
      rollback: 1

  - name: backup
    cli_config:
      backup: yes
      backup_options:
        filename: "{{ inventory_hostname }}.cfg"
        dir_path: /tmp
...